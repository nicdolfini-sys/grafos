<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabalho 1 — Jogo de Grafos</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e293b, var(--bg));
      color: var(--text);
      padding: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 540px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
    p { color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: .4rem .9rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-size: .85rem;
      font-weight: 600;
    }
    svg { margin: 1.5rem auto 0; display: block; }
    .node { fill: var(--accent); }
    .edge { stroke: #475569; stroke-width: 2; }
    .stamp { margin-top: 1.5rem; font-size: .8rem; color: #64748b; }
    code { background: #0f172a; padding: .15rem .4rem; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎲 Jogo de Grafos</h1>
    <p>
      Página de teste publicada automaticamente no <strong>GitHub Pages</strong>
      via <strong>GitHub Actions</strong>. Se você está vendo isto, o pipeline de
      deploy está funcionando.
    </p>
    <svg width="240" height="140" viewBox="0 0 240 140" role="img" aria-label="Grafo de exemplo">
      <line class="edge" x1="40" y1="40" x2="120" y2="20" />
      <line class="edge" x1="40" y1="40" x2="60" y2="110" />
      <line class="edge" x1="120" y1="20" x2="200" y2="60" />
      <line class="edge" x1="120" y1="20" x2="60" y2="110" />
      <line class="edge" x1="200" y1="60" x2="160" y2="120" />
      <line class="edge" x1="60" y1="110" x2="160" y2="120" />
      <circle class="node" cx="40" cy="40" r="10" />
      <circle class="node" cx="120" cy="20" r="10" />
      <circle class="node" cx="200" cy="60" r="10" />
      <circle class="node" cx="60" cy="110" r="10" />
      <circle class="node" cx="160" cy="120" r="10" />
    </svg>
    <div class="badge">deploy: github-actions ✔</div>
    <p class="stamp">
      Publicado a partir de <code>site/</code> na branch <code>main</code>.
    </p>
  </main>
</body>
</html>
